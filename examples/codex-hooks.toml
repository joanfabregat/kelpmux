# Merge these optional tables into your Codex config; review/trust through /hooks.
# kelpmux must be on the hook process's PATH. Adjust to an absolute binary path if needed.
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "kelpmux event codex || true"
timeout = 3

