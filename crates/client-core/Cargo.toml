[package]
name = "kelpmux-client-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Portable Kelpmux terminal state and browser bindings"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "=0.2.2"
