# Dependabot opens NO pull requests in this repo, deliberately.
#
# Version updates are disabled per ecosystem below with
# `open-pull-requests-limit: 0`. Security updates are not governed by this
# file and are disabled at repo level (Settings -> Advanced Security ->
# Dependabot security updates; API: DELETE
# /repos/{owner}/{repo}/automated-security-fixes).
#
# Dependabot alerts stay enabled. Vulnerabilities are fixed by hand.
#
# This file is kept so the ecosystems stay recorded for whenever PRs are
# turned back on.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
