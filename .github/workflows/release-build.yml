name: Release build
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Check release version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$EVENT" != workflow_dispatch ]; then
            test "$TAG" = "v$version"
          fi
      - run: cargo build --release --locked
      - name: Build verified upstream tmux 3.8
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
          curl -fsSL https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o target/tmux-3.8.tar.gz
          scripts/build-tmux.sh target/tmux-3.8.tar.gz "$PWD/target/tmux-3.8"
      - name: Package binary, license, and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/package
          cp target/release/kelpmux LICENSE NOTICE README.md CONTRIBUTING.md dist/package/
          cp -R assets docs examples dist/package/
          cp -R scripts dist/package/
          cp -R target/tmux-3.8 dist/package/tmux
          tar -C dist/package -czf "dist/kelpmux-$TARGET.tar.gz" .
          (cd dist && sha256sum "kelpmux-$TARGET.tar.gz" > "kelpmux-$TARGET.tar.gz.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kelpmux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Attach assets to an already published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
