name: Release build
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/release
          key: rust-release-${{ matrix.runner }}-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: rust-release-${{ matrix.runner }}-${{ matrix.target }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 fetch --locked
      - name: Check release version
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$EVENT" != workflow_dispatch ]; then
            test "$TAG" = "v$version"
          fi
      - run: cargo +1.99.0 build --release --locked --offline
      - name: Collect locked dependency license texts
        run: bash scripts/package-licenses.sh target/dependency-licenses
      - name: Package binary, license, and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/kelpmux LICENSE NOTICE README.md CONTRIBUTING.md dist/package/
          cp -R assets docs examples scripts dist/package/
          cp -R target/dependency-licenses dist/package/
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          archive="kelpmux-$version-$TARGET.tar.gz"
          tar -C dist/package -czf "dist/$archive" .
          (cd dist && sha256sum "$archive" > "$archive.sha256" && sha256sum -c "$archive.sha256")
          tar -tzf "dist/$archive" | grep -Fx './kelpmux'
          tar -tzf "dist/$archive" | grep -Fx './dependency-licenses/dependencies.json'
          target/release/kelpmux --help >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kelpmux-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Save trusted release compiler and dependency cache
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/release
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kelpmux-*
          path: dist
          merge-multiple: true
      - name: Attach verified archives to an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c ./*.sha256)
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
