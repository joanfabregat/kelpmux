name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
          rustup toolchain install 1.99.0 --profile minimal
      - name: Build verified upstream tmux 3.8
        run: |
          mkdir -p target
          curl -fsSL https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o target/tmux-3.8.tar.gz
          scripts/build-tmux.sh target/tmux-3.8.tar.gz "$PWD/target/tmux-3.8"
          echo "$PWD/target/tmux-3.8/bin" >> "$GITHUB_PATH"
      - name: Real tmux integration (private sockets, no user configuration)
        run: cargo test --locked --test tmux -- --ignored --test-threads=1
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked --test core
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install maintained audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --deny warnings
      - name: Check dependency license policy
        run: |
          cargo metadata --locked --format-version 1 > metadata.json
          jq -e 'all(.packages[]; .license as $license | ["MIT", "Apache-2.0", "MIT OR Apache-2.0", "Apache-2.0 OR MIT", "Unlicense OR MIT", "(MIT OR Apache-2.0) AND Unicode-3.0"] | index($license) != null)' metadata.json
