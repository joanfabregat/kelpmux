name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore compiler and dependency cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: rust-quality-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: rust-quality-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch all locked platform sources for license collection
        run: cargo fetch --locked
      - run: cargo +1.99.0 fmt --all -- --check
      - name: Stable demo launcher contracts (no real workspace)
        run: |
          bash -n scripts/demo.sh scripts/test-demo.sh
          bash scripts/test-demo.sh
          bash -n scripts/channels.sh scripts/test-channels.sh
          bash scripts/test-channels.sh
      - run: cargo +1.99.0 clippy --locked --offline --all-targets -- -D warnings
      - name: Unit, metadata, protocol and hook contracts (PTY suites run in the architecture matrix)
        run: cargo +1.99.0 test --locked --offline --lib --test core --test native_protocol --test native_hooks --test native_activity --test native_recovery --test native_delta --test native_templates
      - name: Validate distribution license texts
        run: bash scripts/package-licenses.sh target/dependency-licenses
      - name: Save trusted compiler and dependency cache
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  native:
    name: Native PTY and terminal (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: rust-native-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: rust-native-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 fetch --locked
      - name: Real owned PTYs, terminal engine, and frontend routing
        run: cargo +1.99.0 test --locked --offline --test native_server --test native_engine --test native_workspace --test native_client --test native_ui --test native_tracking --test native_lifecycle --test native_vitals --test native_history --test native_phase2_ui --test native_phase2_server --test native_stream --test native_upgrades --test native_conformance --test native_stress --test native_bridge --test native_program_status --test native_reference -- --test-threads=2
      - name: Save trusted compiler and dependency cache
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  integration:
    name: Legacy tmux compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: rust-legacy-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: rust-legacy-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
      - name: Restore verified tmux build
        id: tmux-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tmux-3.8
          key: tmux-${{ matrix.os }}-${{ runner.arch }}-e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e-${{ hashFiles('scripts/build-tmux.sh') }}
      - name: Install build prerequisites only on cache miss
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - name: Build verified upstream tmux 3.8 for compatibility tests
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p target
          curl --retry 3 -fsSL https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o target/tmux-3.8.tar.gz
          scripts/build-tmux.sh target/tmux-3.8.tar.gz "$PWD/target/tmux-3.8"
      - name: Check cached runtime libraries and enable tmux
        run: |
          if ldd target/tmux-3.8/bin/tmux | grep -q 'not found'; then
            sudo apt-get update
            sudo apt-get install -y libevent-2.1-7t64 libtinfo6
          fi
          target/tmux-3.8/bin/tmux -V
          echo "$PWD/target/tmux-3.8/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 fetch --locked
      - name: Real tmux integration (private sockets, no user configuration)
        run: cargo +1.99.0 test --locked --offline --test tmux -- --ignored --test-threads=2
      - name: Save trusted compiler and dependency cache
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save trusted verified tmux build
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.tmux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tmux-3.8
          key: ${{ steps.tmux-cache.outputs.cache-primary-key }}
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: rust-msrv-${{ runner.os }}-${{ runner.arch }}-1.85.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: rust-msrv-${{ runner.os }}-${{ runner.arch }}-1.85.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 fetch --locked
      - name: All tests on the minimum Rust version, including owned PTYs
        run: cargo +1.85.0 test --locked --offline -- --test-threads=2
      - name: Save trusted compiler and dependency cache
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore pinned audit executable
        id: audit-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-0.22.2
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install maintained audit tool on cache miss
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo +1.99.0 install cargo-audit --version 0.22.2 --locked
      - name: Fetch current RustSec advisories and audit every run
        run: cargo audit --deny warnings
      - name: Check dependency license policy
        run: |
          cargo +1.99.0 metadata --locked --format-version 1 > metadata.json
          jq -e '
            all(.packages[];
              . as $package |
              (["MIT", "Apache-2.0", "MIT OR Apache-2.0", "Apache-2.0 OR MIT", "Unlicense OR MIT"] | index($package.license) != null)
              or ($package.name == "unicode-ident" and $package.license == "(MIT OR Apache-2.0) AND Unicode-3.0")
              or ($package.name == "cursor-icon" and $package.license == "MIT OR Apache-2.0 OR Zlib")
              or ($package.name == "r-efi" and $package.license == "MIT OR Apache-2.0 OR LGPL-2.1-or-later")
              or ((["linux-raw-sys", "rustix", "rustix-openpty"] | index($package.name) != null)
                 and $package.license == "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT")
            )
          ' metadata.json
      - name: Save trusted pinned audit executable
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.audit-cache.outputs.cache-primary-key }}
