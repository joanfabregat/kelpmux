name: CI
on:
  workflow_call:
  push:
    branches: [main, 'refactor/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# KelpServer and the client core (kelpclient) come from the KelpCore
# repository at the revision pinned once in Cargo.toml
# [workspace.dependencies] (and Cargo.lock). Cargo builds the server binary
# with `-p kelpserver --bin kelpserver` and client-core.wasm with
# `-p kelpclient`, from the locked, already fetched sources, into target/.
# The web client's @kelpcore/web comes from the same KelpCore commit
# (web/package.json), fetched by `npm ci` from GitHub.
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.99.0 fetch --locked
      - run: cargo +1.99.0 fmt --all -- --check
      - run: cargo +1.99.0 clippy --workspace --locked --offline --all-targets -- -D warnings
      - run: cargo +1.99.0 build --locked --offline -p kelpserver --bin kelpserver
      - run: cargo +1.99.0 test --workspace --locked --offline -- --test-threads=2
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 fetch --locked
      - run: cargo +1.89.0 build --locked --offline -p kelpserver --bin kelpserver
      - run: cargo +1.89.0 test --workspace --locked --offline -- --test-threads=2
  integration:
    name: Legacy tmux compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: rust-legacy-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-${{ github.sha }}
          restore-keys: rust-legacy-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', '.cargo/**') }}-
      - name: Restore verified tmux build
        id: tmux-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tmux-3.8
          key: tmux-${{ matrix.os }}-${{ runner.arch }}-e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e-${{ hashFiles('scripts/build-tmux.sh') }}
      - name: Install build prerequisites only on cache miss
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libevent-dev libncurses-dev bison
      - name: Build verified upstream tmux 3.8 for compatibility tests
        if: steps.tmux-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p target
          curl --retry 3 -fsSL https://github.com/tmux/tmux/releases/download/3.8/tmux-3.8.tar.gz -o target/tmux-3.8.tar.gz
          scripts/build-tmux.sh target/tmux-3.8.tar.gz "$PWD/target/tmux-3.8"
      - name: Check cached runtime libraries and enable tmux
        run: |
          if ldd target/tmux-3.8/bin/tmux | grep -q 'not found'; then
            sudo apt-get update
            sudo apt-get install -y libevent-2.1-7t64 libtinfo6
          fi
          target/tmux-3.8/bin/tmux -V
          echo "$PWD/target/tmux-3.8/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 fetch --locked
      - run: cargo +1.99.0 build --locked --offline -p kelpserver --bin kelpserver
      - name: Real tmux integration (private sockets, no user configuration)
        run: cargo +1.99.0 test --locked --offline --test tmux -- --ignored --test-threads=2
      - name: Save trusted compiler and dependency cache
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Save trusted verified tmux build
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.tmux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tmux-3.8
          key: ${{ steps.tmux-cache.outputs.cache-primary-key }}
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.99.0 fetch --locked
      - run: cargo +1.99.0 build --locked --offline -p kelpclient --release --target wasm32-unknown-unknown
  web:
    name: Web client (locked npm, WASM core, embedded relay assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.99.0 fetch --locked
      - name: Build the shared terminal core for the browser
        run: |
          cargo +1.99.0 build --locked --offline -p kelpclient --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/kelpclient.wasm web/public/client-core.wasm
      - name: Fetch pinned SSH assets without executing them
        run: bash scripts/fetch-web-ssh.sh
      - name: Share the WASM core and SSH assets with the browser tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-public-generated
          path: |
            web/public/client-core.wasm
            web/public/vendor
          if-no-files-found: error
          retention-days: 1
      - name: Fetch and audit web dependencies
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/web docker.io/library/node:24-bookworm sh -euc "npm ci --ignore-scripts; npm audit --audit-level=high"
      - name: Validate and build web assets
        run: |
          docker run --rm --network=none -v "$GITHUB_WORKSPACE:/w" -w /w/web docker.io/library/node:24-bookworm sh -euc "npm test; npm run check; npm run lint; npm run build"
      - name: Build kelpmux with the embedded web client
        run: |
          cargo +1.99.0 build --locked --offline --release --bin kelpmux
          # The relay must find its assets; it then fails only on the missing configuration.
          if ./target/release/kelpmux web-relay --config /nonexistent/web.json 2> relay.err; then exit 1; fi
          cat relay.err
          ! grep -q 'no web client assets' relay.err
      - name: Share kelpmux with the browser bridge test
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kelpmux-release
          path: target/release/kelpmux
          if-no-files-found: error
          retention-days: 1
  web-browser:
    name: Web browser tests (Playwright)
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Restore the WASM core and SSH assets the web job built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-public-generated
          path: web/public
      # test/bridge.mjs runs the browser's Session against this kelpmux's
      # server and web bridge (binary screens end to end).
      - name: Restore the kelpmux the web job built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kelpmux-release
          path: target/release
      - run: chmod +x target/release/kelpmux
      - name: Fetch and audit web dependencies
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/web mcr.microsoft.com/playwright:v1.64.0-noble sh -euc "npm ci --ignore-scripts; npm audit --audit-level=high"
      # The browsers come from the image, whose tag must match the locked
      # playwright version in web/package-lock.json. The tests serve the
      # client and their fakes from routes or loopback servers only.
      - name: Run the browser tests without network
        run: |
          docker run --rm --network=none --ipc=host -v "$GITHUB_WORKSPACE:/w" -w /w/web mcr.microsoft.com/playwright:v1.64.0-noble sh -euc '
            test "$(node -p "require(\"playwright/package.json\").version")" = 1.64.0
            for test in renderer terminal upload sidebar idle bridge files history config projects repos repo-history history-panel project-home environments github archive; do echo "== $test"; node "test/$test.mjs"; done
            npm run build
            for test in app mobile errors; do echo "== $test"; node "test/$test.mjs"; done'
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Restore pinned audit executable
        id: audit-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust1.99.0-0.22.2
      - run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install maintained audit tool on cache miss
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo +1.99.0 install cargo-audit --version 0.22.2 --locked
      - name: Fetch current RustSec advisories and audit every run
        run: cargo audit --deny warnings
      - name: Check that the client, KelpServer and the web layer share one KelpCore revision
        run: |
          test "$(grep -c '^name = "kelpclient-protocol"$' Cargo.lock)" = 1
          test "$(grep -c '^name = "kelpclient"$' Cargo.lock)" = 1
          server=$(grep -A2 '^name = "kelpserver"$' Cargo.lock | sed -n 's/^source = "\(.*\)#.*/\1/p')
          protocol=$(grep -A2 '^name = "kelpclient-protocol"$' Cargo.lock | sed -n 's/^source = "\(.*\)#.*/\1/p')
          client=$(grep -A2 '^name = "kelpclient"$' Cargo.lock | sed -n 's/^source = "\(.*\)#.*/\1/p')
          test -n "$server" && test "$server" = "$protocol" && test "$server" = "$client"
          rev=${server##*rev=}
          test "$(jq -r '.dependencies["@kelpcore/web"]' web/package.json)" = "github:joanfabregat/kelpcore#$rev"
          jq -e --arg rev "$rev" '.packages["node_modules/@kelpcore/web"].resolved | endswith("#" + $rev)' web/package-lock.json
      - name: Check dependency license policy
        run: |
          cargo +1.99.0 metadata --locked --format-version 1 > metadata.json
          jq -e '
            all(.packages[];
              . as $package |
              (["MIT", "Apache-2.0", "MIT OR Apache-2.0", "Apache-2.0 OR MIT", "Unlicense OR MIT"] | index($package.license) != null)
              # Permissive licenses of the error-reporting stack (sentry, ureq,
              # rustls, ring, webpki-roots, backtrace, url/idna/ICU).
              or (["MIT/Apache-2.0", "0BSD OR MIT OR Apache-2.0", "MIT OR Zlib OR Apache-2.0",
                   "Apache-2.0 OR ISC OR MIT", "Apache-2.0 AND ISC", "ISC", "BSD-3-Clause",
                   "Unicode-3.0", "CDLA-Permissive-2.0"] | index($package.license) != null)
              or ($package.name == "unicode-ident" and $package.license == "(MIT OR Apache-2.0) AND Unicode-3.0")
              or ($package.name == "cursor-icon" and $package.license == "MIT OR Apache-2.0 OR Zlib")
              or ($package.name == "r-efi" and $package.license == "MIT OR Apache-2.0 OR LGPL-2.1-or-later")
              or ((["linux-raw-sys", "rustix", "rustix-openpty", "wasi"] | index($package.name) != null)
                 and $package.license == "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT")
            )
          ' metadata.json
      - name: Save trusted pinned audit executable
        if: success() && contains(fromJSON('["push","workflow_dispatch","release"]'), github.event_name) && steps.audit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.audit-cache.outputs.cache-primary-key }}
