[package]
name = "kelpmux"
version = "0.2.0-beta.7"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Kelp terminal interface"

[dependencies]
kelpserver = { workspace = true }
kelpclient = { workspace = true }
kelpclient-protocol = { workspace = true }
base64 = "0.22"
unicode-width = "=0.2.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The web relay (moved from KelpServer) accepts WebSocket upgrades. Same
# pinned version and features as KelpServer, so no new crate enters the graph.
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
# Optional GlitchTip error reporting (src/native/error_reporting.rs): panics
# and errors only, sent in-process over ureq + rustls (the relay's container
# has no curl). No contexts (it reads the host name), tracing, logs, metrics,
# sessions or debug images.
sentry = { version = "0.49.6", default-features = false, features = ["backtrace", "panic", "ureq"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
toml_edit = { version = "0.25.21", default-features = false, features = ["parse", "display"] }
# Project archives (src/native/archive): tar.gz written and read in process,
# streaming. flate2 (pure Rust backend) and ring (SHA-256) were already in
# the graph through sentry and rustls; tar adds itself and filetime, without
# extended attributes (default features off).
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
ring = "0.17.14"
tar = { version = "0.4.46", default-features = false }

[workspace]
members = ["crates/server", "crates/protocol", "crates/client"]
resolver = "2"

# KelpServer, the protocol types and the client core (kelpclient, also built
# as client-core.wasm) are workspace members, so the server, the TUI and
# client-core.wasm always share one protocol revision.
[workspace.dependencies]
kelpserver = { path = "crates/server", version = "0.3.0-beta.2" }
kelpclient-protocol = { path = "crates/protocol", version = "0.3.0" }
kelpclient = { path = "crates/client", version = "0.1.0" }
