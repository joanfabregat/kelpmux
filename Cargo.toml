[package]
name = "kelpmux"
version = "0.2.0-beta.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Persistent terminal workspaces for coding agents"
repository = "https://github.com/joanfabregat/kelpmux"
keywords = ["tmux", "terminal", "agents", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "0.22"
unicode-width = "=0.2.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
