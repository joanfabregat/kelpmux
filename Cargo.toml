[package]
name = "kelpmux"
version = "0.2.0-beta.6"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Kelp terminal interface"

[dependencies]
kelpserver = { git = "https://github.com/joanfabregat/kelpserver", rev = "1517ce57bc4886b3adea6517f70d773c16396290", version = "0.2.0-beta.6" }
kelpclient = { git = "https://github.com/joanfabregat/kelpclient", rev = "616d1dfb043db078ee593f542602b0f2d58c26a0", version = "0.1.0" }
base64 = "0.22"
unicode-width = "=0.2.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[workspace]
members = []
