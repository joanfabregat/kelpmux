[package]
name = "kelpmux"
version = "0.2.0-beta.7"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Kelp terminal interface"

[dependencies]
kelpserver = { path = "crates/server", version = "0.2.0-beta.7" }
kelpclient = { path = "crates/client", version = "0.1.0" }
base64 = "0.22"
unicode-width = "=0.2.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[workspace]
members = ["crates/server", "crates/client", "crates/protocol"]
resolver = "2"
